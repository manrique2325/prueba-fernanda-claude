{% extends "base.html" %}
{% block title %}Crear cuenta · {{ store.name }}{% endblock %}

{% block content %}
<div class="container">
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Creá tu cuenta</h1>
      <p class="auth-card__sub">Es gratis y te permite seguir tus pedidos.</p>

      <form method="post" action="{{ url_for('auth.register', next=request.args.get('next')) }}">
        <div class="field">
          <label for="name">Nombre y apellido</label>
          <input id="name" name="name" value="{{ form.name }}" required minlength="3" maxlength="120" autocomplete="name" autofocus>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" name="email" value="{{ form.email }}" required autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
          <span class="field-hint">Mínimo 8 caracteres.</span>
        </div>
        <div class="field">
          <label for="confirm_password">Repetir contraseña</label>
          <input id="confirm_password" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">
        </div>
        <button class="btn btn--lg btn--block" type="submit">Crear cuenta</button>
      </form>

      <p class="auth-alt">¿Ya tenés cuenta? <a href="{{ url_for('auth.login', next=request.args.get('next')) }}">Ingresá acá</a></p>
    </div>
  </div>
</div>
{% endblock %}
